version: 3
expires_after: 8h
idle_timeout: 30m

# This is the browser runtime ceiling. It is intentionally origin-scoped, so
# generic desktop input and native window observation are not allowed here.
allow:
  tools:
    - start_session
    - end_session
    - launch_app
    - list_windows
    - browser_prepare
    - get_browser_state
    - browser_navigate
    - browser_click
    - browser_type
    - browser_pointer
    - browser_dialog
    - browser_set_input_files
    - health_report

resources:
  apps:
    - executable: /opt/google/chrome/chrome
      launch: true
      windows: all
      terminate: driver_launched
    - executable: /opt/microsoft/msedge/msedge
      launch: true
      windows: all
      terminate: driver_launched
  browser:
    profiles:
      - kind: isolated
    origins:
      - about:blank
      - https://example.com
      - http://127.0.0.1
      - http://127.0.0.1:4173
      - http://localhost
      - http://localhost:4173
      - http://anesu.test
  desktop:
    display: false
