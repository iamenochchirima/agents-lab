<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f9" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon/favicon-32.png" />
    <title>Agent Harness Lab</title>
    <script>
      (() => {
        try {
          const mode = localStorage.getItem("agentlab-theme");
          const dark = mode === "dark" || (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch {
          // The application applies its defaults after startup.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
